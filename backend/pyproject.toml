# Solo configuración de herramientas; las dependencias viven en requirements.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert es la forma normal de verificar en pytest

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # claves falsas de prueba
