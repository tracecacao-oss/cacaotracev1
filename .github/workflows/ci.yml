# Pruebas en cada push y pull request: lint, migraciones y pytest contra Postgres con PostGIS.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cacaotrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cacaotrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Valores falsos: CI nunca usa las cuentas reales.
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/cacaotrace
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/cacaotrace
      SUPABASE_URL: https://proyecto-prueba.supabase.co
      CORS_ORIGINS: https://cacaotrace.pages.dev

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Migraciones
        run: alembic upgrade head

      - name: Pruebas
        run: pytest
