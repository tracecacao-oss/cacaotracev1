# Blueprint de Render: servicio de la API. Validado contra https://render.com/docs/blueprint-spec (oct. 2026).
# Las variables con sync: false las pega una persona del equipo en el panel; nunca van en este archivo.
services:
  - type: web
    name: cacaotrace-api
    runtime: python
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Reemplaza a autoDeploy: true, que Render marcó como obsoleto.
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: STORAGE_BUCKET
        value: documentos
      - key: PRODUCTOR_EMAIL_DOMAIN
        value: productores.cacaotrace.local
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Parte 4: análisis de cobertura forestal.
      - key: WHISP_API_KEY
        sync: false
      - key: GFW_API_KEY
        sync: false
      - key: ANALISIS_VIGENCIA_DIAS
        value: "180"
      - key: AVISO_VENCIMIENTO_DIAS
        value: "30"
      # Adenda de la Parte 4. MapBiomas pasó la comprobación de viabilidad el 2026-10-05.
      - key: MAPBIOMAS_ACTIVO
        value: "true"
      - key: MAPBIOMAS_ANIO_INICIAL
        value: "2015"
      - key: MAPBIOMAS_ANIO_FINAL
        value: "2024"
      - key: UMBRAL_BOSQUE_2020_PCT
        value: "10"
      # Parte 5: el código QR del DOP lleva a la verificación pública de la interfaz.
      - key: URL_INTERFAZ
        value: https://cacaotrace.pages.dev
