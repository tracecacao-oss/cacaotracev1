# Blueprint de Render: crea la base de datos y el servicio web y los conecta.
# En Render: New > Blueprint > elige este repositorio.
databases:
  - name: cacaotrace-db
    plan: free
    region: oregon

services:
  - type: web
    name: cacaotrace
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 60
    healthCheckPath: /salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: cacaotrace-db
          property: connectionString
      - key: DEMO_PASSWORD
        sync: false
