# Blueprint de Render: servicio de la API. Validado contra https://render.com/docs/blueprint-spec (oct. 2026).
# Las variables con sync: false las pega una persona del equipo en el panel; nunca van en este archivo.
services:
  - type: web
    name: cacaotrace-api
    runtime: python
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Reemplaza a autoDeploy: true, que Render marcó como obsoleto.
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: STORAGE_BUCKET
        value: documentos
      - key: PRODUCTOR_EMAIL_DOMAIN
        value: productores.cacaotrace.local
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
