# Postgres con PostGIS para desarrollo local y pruebas. No se usa en producción.
# Misma versión mayor de Postgres que el proyecto de Supabase (confirmar en el panel).
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cacaotrace
    ports:
      - "5432:5432"
    volumes:
      - datos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cacaotrace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datos_pg:
